name: Build Android APK & Publish to Netlify

on:
  push:
    branches: ["main", "master"]
    paths:
      - "android/**"
      - "docs/index.html"
      - "docs/manifest.webmanifest"
      - "docs/sw.js"
      - "docs/icons/**"
      - "scripts/sync_android_assets.py"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "netlify-deploy"
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync PWA assets into Android assets
        run: python scripts/sync_android_assets.py

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android APK
        run: |
          gradle -p android assembleDebug -PPWA_URL="https://daejeon-oil.netlify.app/" --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/daejeon-cashback-oil.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daejeon-cashback-oil-apk
          path: dist/daejeon-cashback-oil.apk

      - name: Store APK release asset privately in repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "대전 캐시백 주유 지도 Android APK"
          body: |
            대전 온통대전(대전사랑카드) 캐시백 제공 주유소·LPG충전소 유가 비교 Android APK입니다.
            - 익명 Netlify PWA(https://daejeon-oil.netlify.app/) 연결 및 오프라인 내장 데이터 폴백 지원
          files: dist/daejeon-cashback-oil.apk
          make_latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy PWA + APK to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: "312d6d84-36bc-49b7-872c-a3c870fe461d"
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN secret not set; skipping Netlify upload."
            exit 0
          fi
          mkdir -p _deploy/download
          cp -r docs/* _deploy/
          cp docs/_headers _deploy/
          cp dist/daejeon-cashback-oil.apk _deploy/download/daejeon-cashback-oil.apk
          npx --yes netlify-cli deploy --dir=_deploy --prod --site="$NETLIFY_SITE_ID" --message="Publish PWA + APK"
