name: Build Android APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - "android/**"
      - "docs/index.html"
      - "docs/manifest.webmanifest"
      - "docs/sw.js"
      - "docs/icons/**"
      - "scripts/sync_android_assets.py"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync PWA assets into Android assets
        run: python scripts/sync_android_assets.py

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android APK
        run: |
          PWA_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Building APK targeting PWA_URL=$PWA_URL"
          gradle -p android assembleDebug -PPWA_URL="$PWA_URL" --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/daejeon-cashback-oil.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daejeon-cashback-oil-apk
          path: dist/daejeon-cashback-oil.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "대전 캐시백 주유 지도 Android APK"
          body: |
            대전 온통대전(대전사랑카드) 캐시백 제공 주유소·LPG충전소 유가 비교 Android APK입니다.
            - 자동 갱신 PWA 연결 및 오프라인 내장 데이터 폴백 지원
            - APK 직접 설치 시 안드로이드 "출처를 알 수 없는 앱 허용" 1회 승인 필요
          files: dist/daejeon-cashback-oil.apk
          make_latest: true
